<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Cairo"; src: url(../fonts/Cairo.ttf); font-weight: 200 1000; }
  @font-face { font-family: "Inter"; src: url(../fonts/Inter.ttf); font-weight: 100 900; }
  /* Sketch explainer: a notebook page. Paper notes taped down, marker circles and arrows that draw
     themselves, a highlighter pass over the key word, and a hand-made line boil on everything. */
  :root { --accent: #5b4bff; --accent2: #ff6a3d; --paper: #fbf6ea; --ink: #1d1b2e; --rule: rgba(60,90,160,0.16); --hl: #ffe25a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: "Cairo", "Inter", sans-serif; position: relative; }

  .page { position: absolute; inset: 0; background-image: linear-gradient(var(--rule) 2px, transparent 2px); background-size: 100% 64px; background-position: 0 30px; }
  .margin { position: absolute; top: 0; bottom: 0; right: 110px; width: 3px; background: rgba(220,70,70,0.35); }
  .stain { position: absolute; inset: -80px; opacity: 0.06; background-image: repeating-radial-gradient(circle at 23% 37%, #6b4a1f 0 1px, transparent 1px 4px), repeating-radial-gradient(circle at 77% 61%, #6b4a1f 0 1px, transparent 1px 5px); }
  .doodle { position: absolute; fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }

  .brand { position: absolute; top: 110px; left: 50%; transform: translateX(-50%) rotate(-2deg); padding: 6px 30px 14px; font: 900 40px "Inter", "Cairo", sans-serif; letter-spacing: 1px; white-space: nowrap;
    background: linear-gradient(transparent 55%, color-mix(in srgb, var(--hl) 85%, transparent) 55%); }

  .stage { position: absolute; left: 0; right: 0; top: 280px; height: 1040px; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 50px; will-change: transform, opacity; }

  .note { position: relative; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.05), 6px 14px 30px rgba(60,40,10,0.18); }
  .note::before { content: ""; position: absolute; top: -26px; left: 50%; width: 200px; height: 52px; margin-left: -100px; background: rgba(255,226,90,0.6); transform: rotate(-4deg); }
  .title { width: 940px; text-align: center; direction: rtl; font: 900 96px/1.45 "Cairo", sans-serif; }
  em { font-style: normal; background: linear-gradient(100deg, transparent 2%, var(--hl) 4%, var(--hl) 96%, transparent 98%) no-repeat 100% 70% / var(--u, 0%) 62%; padding: 0 10px; }
  .chip { padding: 8px 30px 16px; font: 800 44px "Cairo", sans-serif; direction: rtl; unicode-bidi: plaintext; color: var(--accent2); border: 4px solid var(--accent2); border-radius: 30px 40px 26px 44px; transform: rotate(-2deg); }
  .pic { width: 800px; height: 540px; padding: 22px 22px 70px; background: #fff; box-shadow: 6px 14px 30px rgba(60,40,10,0.2); transform: rotate(-2deg); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(0.25) contrast(1.05); }

  .point { display: grid; justify-items: center; gap: 30px; text-align: center; direction: rtl; }
  .point .mark { position: relative; width: 340px; height: 340px; display: grid; place-items: center; font: 900 230px/1 "Cairo", "Inter", sans-serif; color: var(--accent2); }
  .point .text { max-width: 900px; padding: 40px 54px 54px; font: 900 72px/1.45 "Cairo", sans-serif; background: #fff; box-shadow: 6px 14px 30px rgba(60,40,10,0.18); transform: rotate(1.5deg); }

  .chat { width: 820px; padding: 40px 40px 50px; background: #fff; border: 5px solid var(--ink); border-radius: 70px 64px 74px 60px; display: flex; flex-direction: column; gap: 26px; direction: rtl; }
  .chat .head { display: flex; align-items: center; gap: 18px; font: 800 38px "Cairo", sans-serif; padding-bottom: 14px; border-bottom: 4px solid var(--ink); border-radius: 0 0 40% 10% / 0 0 8px 4px; }
  .chat .head i { width: 60px; height: 60px; border-radius: 50%; border: 5px solid var(--ink); }
  .bubble { max-width: 82%; padding: 18px 34px 28px; font: 800 52px/1.4 "Cairo", sans-serif; border: 4px solid var(--ink); border-radius: 46px 40px 50px 36px; }
  .bubble.you { align-self: flex-start; }
  .bubble.them { align-self: flex-end; background: color-mix(in srgb, var(--accent) 18%, #fff); }

  .steps { width: 880px; display: grid; gap: 30px; direction: rtl; }
  .step { position: relative; display: flex; align-items: center; gap: 30px; padding: 20px 30px 30px; font: 800 56px/1.35 "Cairo", sans-serif; }
  .step .n { flex: none; width: 96px; height: 96px; display: grid; place-items: center; font: 900 54px "Inter"; border: 5px solid var(--ink); border-radius: 50% 46% 52% 44%; }
  .step.on .t { background: linear-gradient(100deg, transparent 1%, var(--hl) 3%, var(--hl) 97%, transparent 99%) no-repeat 0 72% / 100% 60%; }
  .step.on .n { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  .quote { width: 900px; padding: 50px 56px 64px; direction: rtl; background: #fff; box-shadow: 6px 14px 30px rgba(60,40,10,0.18); transform: rotate(-1deg); }
  .quote .src { font: 700 30px "Inter"; color: var(--accent); direction: ltr; text-align: left; margin-bottom: 18px; }
  .quote p { margin: 0; font: 700 56px/1.6 "Cairo", sans-serif; }
  mark { color: inherit; background: linear-gradient(var(--hl), var(--hl)) no-repeat 100% 75% / var(--u, 0%) 60%; padding: 0 6px; }

  .stamp { position: relative; padding: 50px 90px 70px; font: 900 190px/1.1 "Cairo", "Inter", sans-serif; color: var(--accent2); white-space: nowrap; }
  .price { display: grid; justify-items: center; gap: 10px; padding: 50px 90px 66px; background: #fff; box-shadow: 6px 14px 30px rgba(60,40,10,0.18); transform: rotate(2deg); }
  .price small { font: 800 46px "Cairo", sans-serif; }
  .price .v { font: 900 190px/1 "Inter", sans-serif; direction: ltr; font-variant-numeric: tabular-nums; }
  .bars { position: relative; display: flex; align-items: flex-end; gap: 60px; height: 700px; direction: ltr; border-bottom: 6px solid var(--ink); padding: 0 30px; }
  .bar { display: grid; justify-items: center; gap: 16px; width: 210px; }
  .bar .val { font: 900 60px "Inter"; }
  .bar .col { width: 180px; border: 6px solid var(--ink); border-bottom: 0; border-radius: 12px 18px 0 0;
    background: repeating-linear-gradient(-45deg, transparent 0 14px, rgba(29,27,46,0.55) 14px 18px); }
  .bar.last .col { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--accent2) 30%, #fff) 0 14px, var(--accent2) 14px 20px); }
  .bar .name { font: 800 38px "Cairo", sans-serif; text-align: center; direction: rtl; unicode-bidi: plaintext; position: relative; top: 30px; }
  .sticker { position: absolute; right: -40px; top: -70px; padding: 14px 34px 20px; font: 900 64px "Inter"; color: var(--accent2); border: 6px solid var(--accent2); border-radius: 50% 44% 52% 46%; }
  .specs { width: 860px; display: grid; gap: 22px; }
  .spec { position: relative; padding: 16px 70px 26px 20px; font: 800 56px "Cairo", sans-serif; direction: rtl; unicode-bidi: plaintext; }
  .spec::after { content: "✓"; position: absolute; right: 0; top: 12px; font: 900 60px "Inter"; color: var(--accent2); }
  .choice { display: flex; gap: 50px; direction: rtl; }
  .opt { width: 400px; height: 400px; display: grid; place-items: center; align-content: center; gap: 20px; font: 900 66px "Cairo", sans-serif; text-align: center;
    background: #fff; box-shadow: 6px 14px 30px rgba(60,40,10,0.18); }
  .opt.a { transform-origin: 50% 0; } .opt i { font-style: normal; font-size: 120px; line-height: 1; color: var(--accent); }
  .opt.b i { color: var(--accent2); }

  .follow { display: grid; justify-items: center; gap: 16px; }
  .follow .logo { width: 290px; height: 290px; display: grid; place-items: center; background: #fff; box-shadow: 6px 14px 30px rgba(60,40,10,0.2); transform: rotate(-3deg); padding: 24px; }
  .follow .logo img { width: 100%; height: 100%; object-fit: contain; }
  .follow .logo b { font: 900 140px "Inter"; }
  .follow strong { font: 900 100px "Inter", "Cairo", sans-serif; background: linear-gradient(transparent 55%, var(--hl) 55%); padding: 0 20px; }
  .follow bdi { font: 700 40px "Inter"; opacity: 0.75; }
  .fbtn { position: relative; width: 340px; height: 106px; border: 5px solid var(--ink); border-radius: 60px 50px 64px 46px; font: 900 44px "Inter"; overflow: hidden; }
  .fbtn span { position: absolute; inset: 0; display: grid; place-items: center; }
  .fbtn .b, .fbtn.done .a { opacity: 0; } .fbtn.done .b { opacity: 1; } .fbtn.done { background: var(--ink); color: var(--paper); }

  /* marker strokes drawn over a scene (circles, underlines, arrows) */
  .marks { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .marks path { fill: none; stroke: var(--accent2); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }

  /* the line being said, written on the page */
  .say { position: absolute; left: 60px; right: 60px; top: 1380px; height: 260px; display: flex; align-items: center; justify-content: center; }
  .say .line { text-align: center; direction: rtl; font: 900 74px/1.45 "Cairo", sans-serif; }
  .w { display: inline-block; will-change: transform, opacity; }
  .w.lat { font-family: "Inter", sans-serif; font-weight: 900; }
  .w.key { background: linear-gradient(100deg, transparent 2%, var(--hl) 4%, var(--hl) 96%, transparent 98%) no-repeat 100% 72% / var(--hlw, 0%) 58%; padding: 0 8px; }
</style>
</head>
<body>
<div class="page"></div>
<div class="margin"></div>
<div class="stain"></div>
<svg class="doodle" id="d1" style="left:60px;top:250px" width="160" height="120" viewBox="0 0 160 120"><path d="M10 90 C40 20 80 20 100 60 S150 90 150 30"/><path d="M134 22 L150 30 L146 48"/></svg>
<svg class="doodle" id="d2" style="right:60px;top:1240px" width="140" height="140" viewBox="0 0 140 140"><path d="M70 10 L82 52 L128 56 L92 82 L104 128 L70 100 L34 128 L46 82 L10 56 L56 52 Z"/></svg>
<div class="brand" id="brand"></div>
<div class="stage" id="stage"></div>
<svg class="marks" id="marks" width="1080" height="1920" viewBox="0 0 1080 1920"><path id="m"/></svg>
<div class="say" id="say"></div>
<script type="module" src="sketch.js"></script>
</body>
</html>
