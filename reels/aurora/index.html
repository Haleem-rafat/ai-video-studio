<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Cairo"; src: url(../fonts/Cairo.ttf); font-weight: 200 1000; }
  @font-face { font-family: "Inter"; src: url(../fonts/Inter.ttf); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url(../fonts/JetBrainsMono.ttf); font-weight: 100 800; }
  /* Aurora glass: slow colour light drifting on deep indigo, frosted glass cards floating over it. */
  :root { --accent: #b8b3ff; --accent2: #ff7a59; --bg: #0b0d26; --b2: #4f6bff; --b3: #3fd0ff; --b4: #d46bff; --glass: rgba(255,255,255,0.08); --edge: rgba(255,255,255,0.32); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--bg); color: #f4f3ff; font-family: "Cairo", "Inter", sans-serif; position: relative; }

  .sky { position: absolute; inset: -200px; filter: blur(130px) saturate(1.15); }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; opacity: 0.75; will-change: transform; }
  .blob.a { background: var(--accent); } .blob.b { background: var(--b2); } .blob.c { background: var(--b3); opacity: 0.45; } .blob.d { background: var(--b4); opacity: 0.55; }
  .blob.e { background: var(--accent2); opacity: 0.28; width: 600px; height: 600px; }
  .shade { position: absolute; inset: 0; background: radial-gradient(70% 55% at 50% 48%, transparent 30%, rgba(5,6,22,0.72) 100%); }
  .noise { position: absolute; inset: -60px; opacity: 0.05; mix-blend-mode: overlay;
    background-image: repeating-radial-gradient(circle at 13% 27%, #fff 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 67% 71%, #fff 0 1px, transparent 1px 4px); }

  .glass { background: var(--glass); backdrop-filter: blur(34px) saturate(1.4); -webkit-backdrop-filter: blur(34px) saturate(1.4);
    border: 1.5px solid var(--edge); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 40px 120px rgba(4,4,30,0.45); }

  .title, .point, .chat, .step, .quote, .chip { background: var(--glass); backdrop-filter: blur(34px) saturate(1.4); -webkit-backdrop-filter: blur(34px) saturate(1.4);
    border: 1.5px solid var(--edge); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 40px 120px rgba(4,4,30,0.4); }
  .brand { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); padding: 14px 34px 16px; border-radius: 40px; font: 600 30px "Inter", "Cairo", sans-serif; letter-spacing: 3px; color: #e9e7ff; white-space: nowrap; }
  .brand::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-right: 14px; vertical-align: 3px; box-shadow: 0 0 18px var(--accent); }

  .stage { position: absolute; left: 0; right: 0; top: 300px; height: 1000px; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; will-change: transform, opacity, filter; }

  .title { width: 900px; padding: 70px 64px 80px; border-radius: 60px; text-align: center; direction: rtl; font: 800 84px/1.4 "Cairo", sans-serif; }
  em { font-style: normal; color: #fff; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 55%, transparent) 62%) no-repeat 100% 0 / var(--u, 0%) 100%; padding: 0 6px; }
  .chip { padding: 16px 36px 20px; border-radius: 40px; font: 700 40px "Cairo", "Inter", sans-serif; direction: rtl; unicode-bidi: plaintext; }
  .pic { width: 840px; height: 560px; border-radius: 50px; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .point { width: 900px; padding: 60px 60px 74px; border-radius: 60px; display: grid; justify-items: center; gap: 26px; text-align: center; direction: rtl; }
  .point .mark { width: 230px; height: 230px; border-radius: 50%; display: grid; place-items: center; font: 800 130px/1 "Inter", "Cairo", sans-serif;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), color-mix(in srgb, var(--accent) 50%, transparent) 60%); border: 1.5px solid var(--edge); color: #fff; box-shadow: 0 0 80px color-mix(in srgb, var(--accent) 50%, transparent); }
  .point .text { font: 800 66px/1.45 "Cairo", sans-serif; }

  .chat { width: 860px; padding: 40px 40px 50px; border-radius: 60px; display: flex; flex-direction: column; gap: 26px; direction: rtl; }
  .chat .head { display: flex; align-items: center; gap: 18px; font: 700 34px "Cairo", sans-serif; color: #cfd0f4; padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.15); }
  .chat .head i { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--b2)); }
  .bubble { max-width: 80%; padding: 22px 32px 28px; border-radius: 36px; font: 700 44px/1.45 "Cairo", sans-serif; }
  .bubble.you { align-self: flex-start; background: rgba(255,255,255,0.14); border-bottom-right-radius: 10px; }
  .bubble.them { align-self: flex-end; background: color-mix(in srgb, var(--accent) 45%, rgba(255,255,255,0.1)); border-bottom-left-radius: 10px; }

  .steps { width: 880px; display: grid; gap: 26px; direction: rtl; }
  .step { display: flex; align-items: center; gap: 30px; padding: 30px 40px 36px; border-radius: 44px; font: 700 50px/1.35 "Cairo", sans-serif; transition: none; }
  .step .n { flex: none; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 800 44px "Inter"; background: rgba(255,255,255,0.12); }
  .step.on { background: color-mix(in srgb, var(--accent) 30%, rgba(255,255,255,0.08)); border-color: rgba(255,255,255,0.6); box-shadow: 0 0 90px color-mix(in srgb, var(--accent) 40%, transparent); }
  .step.on .n { background: var(--accent); color: var(--bg); }

  .quote { width: 900px; padding: 50px 56px 64px; border-radius: 56px; direction: rtl; }
  .quote .src { font: 600 28px "JetBrains Mono", monospace; color: #b6b5e0; direction: ltr; text-align: left; margin-bottom: 24px; }
  .quote p { margin: 0; font: 700 54px/1.6 "Cairo", sans-serif; }
  mark { color: #fff; background: linear-gradient(color-mix(in srgb, var(--accent) 60%, transparent), color-mix(in srgb, var(--accent) 60%, transparent)) no-repeat 100% 90% / var(--u, 0%) 14px; padding: 0 4px; }

  .stamp { padding: 30px 80px 50px; border-radius: 70px; font: 900 170px/1.15 "Cairo", "Inter", sans-serif; color: #fff; white-space: nowrap;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(30px); border: 1.5px solid var(--edge); text-shadow: 0 0 60px var(--accent); }
  .price { display: grid; justify-items: center; gap: 12px; padding: 70px 100px 80px; border-radius: 70px; background: var(--glass); backdrop-filter: blur(34px); border: 1.5px solid var(--edge); }
  .price small { font: 700 44px "Cairo", sans-serif; color: #cfd0f4; }
  .price .v { font: 800 180px/1 "Inter", sans-serif; letter-spacing: -6px; direction: ltr; font-variant-numeric: tabular-nums; }
  .bars { position: relative; display: flex; align-items: flex-end; gap: 60px; height: 700px; direction: ltr; }
  .bar { display: grid; justify-items: center; gap: 16px; width: 220px; }
  .bar .val { font: 800 56px "Inter", sans-serif; }
  .bar .col { width: 190px; border-radius: 40px; background: rgba(255,255,255,0.16); border: 1.5px solid var(--edge); backdrop-filter: blur(20px); }
  .bar.last .col { background: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 0 80px color-mix(in srgb, var(--accent) 50%, transparent); }
  .bar .name { font: 700 36px "Cairo", sans-serif; text-align: center; direction: rtl; unicode-bidi: plaintext; }
  .sticker { position: absolute; right: -60px; top: -60px; padding: 14px 32px; border-radius: 30px; background: var(--accent2); font: 800 60px "Inter"; }
  .specs { width: 860px; display: grid; gap: 24px; }
  .spec { padding: 28px 44px 34px; border-radius: 44px; font: 700 52px "Cairo", sans-serif; direction: rtl; unicode-bidi: plaintext; background: var(--glass); backdrop-filter: blur(30px); border: 1.5px solid var(--edge); }
  .choice { display: flex; gap: 40px; direction: rtl; }
  .opt { width: 420px; height: 420px; border-radius: 70px; display: grid; place-items: center; align-content: center; gap: 22px; font: 800 62px "Cairo", sans-serif; text-align: center;
    background: var(--glass); backdrop-filter: blur(34px); border: 1.5px solid var(--edge); }
  .opt i { font-style: normal; font-size: 110px; line-height: 1; }
  .opt.b { background: color-mix(in srgb, var(--accent) 28%, rgba(255,255,255,0.06)); }

  .follow { width: 820px; padding: 60px 50px 66px; border-radius: 70px; display: grid; justify-items: center; gap: 16px; background: var(--glass); backdrop-filter: blur(34px); border: 1.5px solid var(--edge); }
  .follow .logo { width: 220px; height: 220px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: rgba(255,255,255,0.9); box-shadow: 0 0 90px color-mix(in srgb, var(--accent) 55%, transparent); }
  .follow .logo img { width: 78%; height: 78%; object-fit: contain; }
  .follow .logo b { font: 900 100px "Inter"; color: var(--bg); }
  .follow strong { font: 800 70px "Inter", "Cairo", sans-serif; letter-spacing: 1px; }
  .follow bdi { font: 500 34px "JetBrains Mono", monospace; color: #c4c3ea; }
  .fbtn { position: relative; margin-top: 18px; width: 320px; height: 96px; border-radius: 48px; background: #fff; color: var(--bg); font: 800 36px "Inter"; overflow: hidden; }
  .fbtn span { position: absolute; inset: 0; display: grid; place-items: center; }
  .fbtn .b, .fbtn.done .a { opacity: 0; } .fbtn.done .b { opacity: 1; } .fbtn.done { background: rgba(255,255,255,0.18); color: #fff; }

  /* the line being said, in a frosted pill */
  .say { position: absolute; left: 70px; right: 70px; top: 1370px; min-height: 230px; display: flex; align-items: center; justify-content: center; }
  .say .line { display: inline-block; padding: 26px 44px 36px; border-radius: 50px; text-align: center; direction: rtl; font: 800 66px/1.5 "Cairo", sans-serif;
    background: rgba(255,255,255,0.07); backdrop-filter: blur(26px); border: 1.5px solid rgba(255,255,255,0.22); }
  .w { display: inline-block; will-change: transform, opacity; }
  .w.lat { font-family: "Inter", sans-serif; font-weight: 700; }
  .w.key { color: #fff; text-shadow: 0 0 34px var(--accent), 0 0 4px var(--accent); }
</style>
</head>
<body>
<div class="sky"><div class="blob a" id="b0"></div><div class="blob b" id="b1"></div><div class="blob c" id="b2"></div><div class="blob d" id="b3"></div><div class="blob e" id="b4"></div></div>
<div class="shade"></div>
<div class="noise" id="noise"></div>
<div class="brand glass" id="brand"></div>
<div class="stage" id="stage"></div>
<div class="say" id="say"></div>
<script type="module" src="aurora.js"></script>
</body>
</html>
