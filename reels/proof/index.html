<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Cairo"; src: url(../fonts/Cairo.ttf); font-weight: 200 1000; }
  :root { --accent: #ff7a1a; --blue: #2f6bff; --ink: #0d1117; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: #0b0d12; font-family: "Cairo", -apple-system, sans-serif; color: #fff; position: relative; }

  /* ---- top half: the proof ---- */
  .top { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, #1b2233 0%, #0b0d12 70%); }
  .scene { position: absolute; inset: 0; will-change: opacity, transform; }
  .window { position: absolute; left: 60px; top: 90px; width: 960px; height: 800px; border-radius: 22px; overflow: hidden; background: #fff;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .bar { height: 62px; background: #ecedf0; display: flex; align-items: center; gap: 12px; padding: 0 22px; direction: ltr; border-bottom: 1px solid #d5d7dc; }
  .bar i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .url { margin-left: 22px; flex: 1; height: 38px; border-radius: 10px; background: #fff; color: #444; font: 500 22px -apple-system, sans-serif;
    display: flex; align-items: center; padding: 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page { position: absolute; top: 62px; left: 0; right: 0; bottom: 0; overflow: hidden; background: #fff; }
  .page img { width: 100%; display: block; transform-origin: 50% 0; will-change: transform; }
  .page.fit img { height: 100%; object-fit: cover; transform-origin: 50% 50%; }

  .stat { position: absolute; left: 50%; top: 50%; min-width: 620px; padding: 46px 70px 54px; border-radius: 40px; text-align: center;
    background: rgba(13, 17, 23, 0.94); border: 2px solid rgba(255, 255, 255, 0.12); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
  .stat b { display: block; font: 900 170px/1.05 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -4px; direction: ltr; }
  .stat span { display: block; margin-top: 8px; font: 700 46px -apple-system, sans-serif; color: #c9d1d9; direction: ltr; }

  .hook { position: absolute; left: 70px; right: 70px; top: 250px; padding: 54px 50px 62px; border-radius: 34px; background: #fff; color: var(--ink);
    text-align: center; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55); direction: ltr; will-change: transform, opacity; }
  .hook div { font: 900 88px/1.12 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -2px; }
  .hook mark { display: inline-block; margin-top: 14px; padding: 2px 26px 8px; border-radius: 16px; background: var(--blue); color: #fff; }

  /* ---- bottom half: the presenter at a desk ---- */
  .bottom { position: absolute; left: 0; top: 960px; width: 1080px; height: 960px; overflow: hidden;
    background: linear-gradient(180deg, #151826 0%, #0e1019 70%, #0a0b10 100%); }
  .neon { position: absolute; left: -10%; right: -10%; top: 120px; height: 420px; filter: blur(60px); opacity: 0.55;
    background: radial-gradient(50% 50% at 30% 50%, #7c5cff 0%, transparent 70%), radial-gradient(50% 50% at 72% 50%, var(--accent) 0%, transparent 70%); }
  .strip { position: absolute; left: 80px; right: 80px; top: 92px; height: 8px; border-radius: 8px; background: linear-gradient(90deg, #7c5cff, var(--accent));
    box-shadow: 0 0 30px #7c5cff, 0 0 60px var(--accent); }
  .shelf { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: linear-gradient(180deg, #23262f, #15171d); border-top: 3px solid #2e323d; }
  .avatar { position: absolute; left: 50%; bottom: 40px; width: 540px; transform-origin: 50% 100%; will-change: transform; }
  .avatar img { position: absolute; left: 0; bottom: 0; width: 100%; display: block; opacity: 0; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.55)); }
  .divider { position: absolute; left: 0; right: 0; top: 957px; height: 6px; background: linear-gradient(90deg, #7c5cff, var(--accent)); }
  .handle { position: absolute; left: 50%; top: 932px; transform: translateX(-50%); padding: 6px 26px 10px; border-radius: 999px; background: #0b0d12;
    border: 2px solid rgba(255, 255, 255, 0.16); font: 700 30px -apple-system, sans-serif; direction: ltr; }

  /* ---- captions and the closing ask ---- */
  .caption { position: absolute; left: 50%; top: 1438px; transform: translateX(-50%); max-width: 940px; padding: 14px 40px 22px; border-radius: 30px;
    background: rgba(8, 10, 14, 0.86); text-align: center; direction: rtl; font-weight: 800; font-size: 60px; line-height: 1.38; white-space: normal;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); }
  .caption .key { color: var(--accent); font-weight: 900; }
  .caption span { display: inline-block; white-space: pre; }
  .cta { position: absolute; left: 70px; right: 70px; top: 640px; padding: 30px 40px 38px; border-radius: 34px; background: #fff; color: var(--ink); text-align: center;
    direction: rtl; font-weight: 900; font-size: 62px; line-height: 1.3; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); will-change: transform, opacity; }
  .cta b { color: #fff; background: var(--blue); border-radius: 14px; padding: 0 18px 6px; }
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="bottom">
  <div class="neon"></div>
  <div class="strip"></div>
  <div class="shelf"></div>
  <div class="avatar" id="avatar"></div>
</div>
<div class="divider"></div>
<div class="handle" id="handle"></div>
<div class="caption" id="caption"></div>
<div class="cta" id="cta"></div>
<script type="module" src="proof.js"></script>
</body>
</html>
