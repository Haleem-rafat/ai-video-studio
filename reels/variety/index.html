<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Cairo"; src: url(../fonts/Cairo.ttf); font-weight: 200 1000; }
  @font-face { font-family: "Inter"; src: url(../fonts/Inter.ttf); font-weight: 100 900; }
  /* Variety captions: TV variety-show caption art. Fat rounded words with a white stroke, a coloured outer
     stroke and a drop shadow, popping in with overshoot; burst frames, sparkles and sweat drops. */
  :root { --accent: #7b5cff; --accent2: #ff4f9a; --sun: #ffd23f; --sky: #29d3ff; --ink: #1b1440; --paper: #fff8ec; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--sun); color: var(--ink); font-family: "Cairo", "Inter", sans-serif; position: relative; }

  .rays { position: absolute; left: 50%; top: 44%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px; will-change: transform;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--sun) 70%, #fff) 0 7.5deg, var(--sun) 7.5deg 15deg); }
  .tint { position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 44%, transparent 40%, color-mix(in srgb, var(--accent2) 35%, transparent) 100%); }
  .dots { position: absolute; inset: 0; opacity: 0.25; background-image: radial-gradient(var(--ink) 3px, transparent 3.5px); background-size: 46px 46px;
    mask-image: linear-gradient(transparent 60%, #000); }
  .deco { position: absolute; font: 900 90px "Inter"; will-change: transform; }
  .deco.s1 { left: 90px; top: 360px; color: #fff; } .deco.s2 { right: 100px; top: 1180px; color: var(--sky); } .deco.s3 { right: 140px; top: 330px; color: var(--accent2); font-size: 70px; }

  .brand { position: absolute; top: 110px; left: 50%; transform: translateX(-50%) rotate(-3deg); padding: 10px 38px 16px; border-radius: 40px; background: var(--ink); color: #fff;
    font: 900 36px "Inter", "Cairo", sans-serif; letter-spacing: 2px; box-shadow: 0 8px 0 var(--accent2); white-space: nowrap; }

  .stage { position: absolute; left: 0; right: 0; top: 280px; height: 1040px; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; will-change: transform, opacity; }

  /* the variety-caption word: fill + thick white stroke + coloured outer stroke + drop shadow */
  .fx { paint-order: stroke fill; -webkit-text-stroke: 14px #fff;
    text-shadow: 0 0 0 var(--ink), 7px 7px 0 var(--accent), 9px 12px 0 var(--ink); }
  .title { width: 960px; text-align: center; direction: rtl; font: 900 104px/1.35 "Cairo", sans-serif; color: var(--ink); paint-order: stroke fill; -webkit-text-stroke: 16px #fff;
    filter: drop-shadow(8px 10px 0 var(--accent)); }
  em { font-style: normal; color: var(--accent2); }
  .card { background: #fff; border: 7px solid var(--ink); border-radius: 46px; box-shadow: 14px 16px 0 var(--ink); }
  .chip { padding: 12px 38px 20px; border-radius: 40px; background: var(--accent2); color: #fff; font: 900 44px "Cairo", sans-serif; direction: rtl; unicode-bidi: plaintext;
    border: 6px solid var(--ink); box-shadow: 8px 9px 0 var(--ink); }
  .pic { width: 820px; height: 560px; border-radius: 46px; overflow: hidden; border: 8px solid #fff; box-shadow: 0 0 0 7px var(--ink), 16px 18px 0 7px var(--ink); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .point { display: grid; justify-items: center; gap: 30px; text-align: center; direction: rtl; }
  .point .mark { position: relative; width: 380px; height: 380px; display: grid; place-items: center; font: 900 230px/1 "Cairo", "Inter", sans-serif; color: var(--accent2);
    paint-order: stroke fill; -webkit-text-stroke: 18px #fff; filter: drop-shadow(9px 11px 0 var(--ink)); }
  .point .mark::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--sky); border: 7px solid var(--ink);
    clip-path: polygon(50% 0, 61% 18%, 82% 8%, 80% 30%, 100% 36%, 85% 52%, 98% 70%, 77% 72%, 76% 95%, 58% 82%, 45% 100%, 37% 80%, 16% 92%, 20% 69%, 0 62%, 16% 47%, 4% 28%, 25% 26%, 23% 4%, 42% 17%); }
  .point .text { max-width: 940px; padding: 30px 50px 44px; font: 900 70px/1.4 "Cairo", sans-serif; }

  .chat { width: 880px; padding: 36px 36px 46px; display: flex; flex-direction: column; gap: 26px; direction: rtl; }
  .chat .head { display: flex; align-items: center; gap: 18px; font: 900 38px "Cairo", sans-serif; padding-bottom: 16px; border-bottom: 5px dashed var(--ink); }
  .chat .head i { width: 60px; height: 60px; border-radius: 50%; background: var(--sky); border: 5px solid var(--ink); }
  .bubble { max-width: 82%; padding: 18px 34px 28px; border-radius: 40px; font: 900 50px/1.4 "Cairo", sans-serif; border: 6px solid var(--ink); }
  .bubble.you { align-self: flex-start; background: #fff; box-shadow: -8px 8px 0 var(--ink); }
  .bubble.them { align-self: flex-end; background: var(--accent); color: #fff; box-shadow: 8px 8px 0 var(--ink); }

  .steps { width: 900px; display: grid; gap: 28px; direction: rtl; }
  .step { display: flex; align-items: center; gap: 28px; padding: 24px 36px 34px; border-radius: 40px; background: #fff; border: 6px solid var(--ink); box-shadow: 10px 11px 0 var(--ink);
    font: 900 54px/1.35 "Cairo", sans-serif; }
  .step .n { flex: none; width: 90px; height: 90px; border-radius: 50%; display: grid; place-items: center; font: 900 50px "Inter"; background: var(--sun); border: 5px solid var(--ink); }
  .step.on { background: var(--accent2); color: #fff; transform-origin: center; }
  .step.on .n { background: #fff; color: var(--ink); }

  .quote { width: 920px; padding: 46px 56px 60px; direction: rtl; }
  .quote .src { font: 900 30px "Inter"; color: var(--accent); direction: ltr; text-align: left; margin-bottom: 18px; }
  .quote p { margin: 0; font: 900 56px/1.55 "Cairo", sans-serif; }
  mark { color: var(--ink); background: linear-gradient(var(--sun), var(--sun)) no-repeat 100% 92% / var(--u, 0%) 26px; padding: 0 4px; }

  .stamp { position: relative; padding: 70px 110px; font: 900 190px/1.1 "Cairo", "Inter", sans-serif; color: #fff; white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke: 18px var(--ink); }
  .stamp::before { content: ""; position: absolute; inset: -40px -60px; z-index: -1; background: var(--accent2); border: 8px solid var(--ink);
    clip-path: polygon(50% 0, 58% 22%, 78% 4%, 74% 28%, 100% 22%, 84% 44%, 100% 62%, 78% 64%, 86% 92%, 62% 76%, 50% 100%, 40% 76%, 14% 94%, 22% 66%, 0 60%, 18% 44%, 2% 22%, 26% 28%, 22% 4%, 42% 22%); }
  .price { display: grid; justify-items: center; gap: 10px; padding: 50px 90px 66px; }
  .price small { font: 900 46px "Cairo", sans-serif; }
  .price .v { font: 900 190px/1 "Inter", sans-serif; color: var(--accent2); direction: ltr; paint-order: stroke fill; -webkit-text-stroke: 12px var(--ink); font-variant-numeric: tabular-nums; }
  .bars { position: relative; display: flex; align-items: flex-end; gap: 56px; height: 700px; direction: ltr; }
  .bar { display: grid; justify-items: center; gap: 16px; width: 220px; }
  .bar .val { font: 900 60px "Inter"; paint-order: stroke fill; -webkit-text-stroke: 10px #fff; }
  .bar .col { width: 200px; border-radius: 30px 30px 10px 10px; background: var(--sky); border: 7px solid var(--ink); box-shadow: 10px 0 0 var(--ink); }
  .bar.last .col { background: var(--accent2); }
  .bar .name { font: 900 38px "Cairo", sans-serif; text-align: center; direction: rtl; unicode-bidi: plaintext; }
  .sticker { position: absolute; right: -60px; top: -80px; padding: 12px 34px 18px; border-radius: 30px; background: var(--ink); color: var(--sun); font: 900 66px "Inter"; }
  .specs { width: 880px; display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; }
  .spec { padding: 18px 42px 28px; border-radius: 60px; background: #fff; border: 6px solid var(--ink); box-shadow: 8px 9px 0 var(--ink); font: 900 52px "Cairo", sans-serif; direction: rtl; unicode-bidi: plaintext; }
  .spec:nth-child(2n) { background: var(--sky); } .spec:nth-child(3n) { background: var(--accent2); color: #fff; }
  .choice { display: flex; gap: 46px; direction: rtl; }
  .opt { width: 420px; height: 420px; border-radius: 60px; display: grid; place-items: center; align-content: center; gap: 22px; font: 900 66px "Cairo", sans-serif; text-align: center;
    background: #fff; border: 8px solid var(--ink); box-shadow: 14px 16px 0 var(--ink); }
  .opt i { font-style: normal; font-size: 130px; line-height: 1; }
  .opt.b { background: var(--sky); }

  .follow { display: grid; justify-items: center; gap: 18px; }
  .follow .logo { width: 280px; height: 280px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #fff; border: 9px solid var(--ink); box-shadow: 14px 16px 0 var(--ink); }
  .follow .logo img { width: 78%; height: 78%; object-fit: contain; }
  .follow .logo b { font: 900 130px "Inter"; }
  .follow strong { font: 900 100px "Inter", "Cairo", sans-serif; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 16px var(--ink); }
  .follow bdi { font: 900 40px "Inter"; }
  .fbtn { position: relative; width: 360px; height: 110px; border-radius: 60px; background: var(--accent2); color: #fff; font: 900 44px "Inter"; overflow: hidden; border: 7px solid var(--ink); box-shadow: 9px 10px 0 var(--ink); }
  .fbtn span { position: absolute; inset: 0; display: grid; place-items: center; }
  .fbtn .b, .fbtn.done .a { opacity: 0; } .fbtn.done .b { opacity: 1; } .fbtn.done { background: var(--sky); color: var(--ink); }

  /* the line being said: variety caption words, the key word bigger and pink */
  .say { position: absolute; left: 30px; right: 30px; top: 1350px; height: 300px; display: flex; align-items: center; justify-content: center; }
  .say .line { text-align: center; direction: rtl; font: 900 82px/1.35 "Cairo", sans-serif; color: #fff; }
  .w { display: inline-block; margin: 0 6px; paint-order: stroke fill; -webkit-text-stroke: 14px var(--ink); filter: drop-shadow(5px 7px 0 var(--ink)); will-change: transform, opacity; }
  .w.lat { font-family: "Inter", sans-serif; font-weight: 900; }
  .w.key { color: var(--sun); font-size: 104px; }
</style>
</head>
<body>
<div class="rays" id="rays"></div>
<div class="tint"></div>
<div class="dots"></div>
<div class="deco s1" id="d1">✦</div><div class="deco s2" id="d2">✦</div><div class="deco s3" id="d3">💧</div>
<div class="brand" id="brand"></div>
<div class="stage" id="stage"></div>
<div class="say" id="say"></div>
<script type="module" src="variety.js"></script>
</body>
</html>
